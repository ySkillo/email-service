<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>happychat</title>
<style>
@media only screen and (max-width:640px) {
  .wrap { padding: 16px 8px !important; }
  .px { padding-left: 20px !important; padding-right: 20px !important; }
}
</style>
</head>
<body style="margin:0;padding:0;background-color:#F4F5FB;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#F4F5FB;font-size:1px;line-height:1px;">Você recebeu uma nova mensagem de {{Remetente}} no happychat.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F4F5FB" style="background-color:#F4F5FB;">
<tr><td align="center" class="wrap" style="padding:48px 16px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
  
  <!-- Header -->
  <tr><td class="px" align="center" bgcolor="#4F46E5" style="background-color:#4F46E5;background-image:linear-gradient(135deg,#4F46E5 0%,#7C3AED 100%);border-radius:24px 24px 0 0;padding:36px 40px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
      <td align="center" style="background-color:rgba(255,255,255,0.15);border-radius:16px;width:56px;height:56px;font-size:26px;line-height:56px;text-align:center;">✉️</td>
    </tr></table>
    <div style="margin-top:14px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.5px;color:#FFFFFF;">happychat</div>
  </td></tr>

  <!-- Conteúdo em formato de Balão de Chat -->
  <tr><td class="px" bgcolor="#FFFFFF" style="background-color:#FFFFFF;border-radius:0 0 24px 24px;padding:40px 40px 36px 40px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#1E293B;">
    <h1 style="margin:0 0 8px 0;font-size:22px;line-height:30px;font-weight:700;color:#0F172A;">Nova mensagem</h1>
    <p style="margin:0 0 20px 0;font-size:14px;line-height:22px;color:#64748B;"><strong style="color:#0F172A;">{{Remetente}}</strong> enviou uma mensagem para você:</p>
    
    <!-- Caixa simulando balão de chat -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 u 24px 0;"><tr>
      <td bgcolor="#F1F5F9" style="background-color:#F1F5F9;border-radius:16px 16px 16px 4px;padding:20px 22px;font-size:16px;line-height:24px;color:#0F172A;word-break:break-word;">
        "{{Mensagem}}"
      </td>
    </tr></table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:24px;"><tr>
      <td align="center">
        <a href="#" style="display:inline-block;background-color:#4F46E5;color:#FFFFFF;font-size:15px;font-weight:600;text-decoration:none;padding:14px 28px;border-radius:12px;box-shadow:0 4px 12px rgba(79,70,229,0.3);">Responder no app</a>
      </td>
    </tr></table>
  </td></tr>

  <!-- Rodapé -->
  <tr><td align="center" style="padding:24px 20px 0 20px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#94A3B8;">
    Você recebeu esta notificação porque tem uma conta no happychat.<br>E-mail automático, por favor, não responda.
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
